[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carezoa-backend"
version = "0.1.0"
description = "CAREZOA home-healthcare marketplace backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "redis>=5.2",
  "celery>=5.4",
  "passlib[argon2,bcrypt]>=1.7.4",
  "pyjwt>=2.9",
  "httpx>=0.28",
  "structlog>=24.4",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
